<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>yomu — local Japanese reader</title>
    <style>
      :root {
        --bg: #fafafa;
        --s1: #f2f2f2;
        --s2: #e9e9e9;
        --bd: #dcdcdc;
        --tx: #111;
        --mu: #767676;
        --ac: #0a6cff;
        --acbg: #e6f0ff;
        --r: 4px;
        --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --s1: #141414;
          --s2: #1d1d1d;
          --bd: #2a2a2a;
          --tx: #ededed;
          --mu: #8a8a8a;
          --ac: #5b9cff;
          --acbg: #14233d;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font: 14px/1.5 var(--sans);
        letter-spacing: -0.01em;
      }
      body {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .mono {
        font-family: var(--mono);
        letter-spacing: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        padding: 10px 14px;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: -0.03em;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 span {
        font: 11px var(--mono);
        color: var(--mu);
      }
      .pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .pill {
        font: 12px var(--sans);
        letter-spacing: -0.01em;
        border: 1px solid var(--bd);
        background: var(--s1);
        color: var(--tx);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .pill[aria-pressed="true"] {
        background: var(--acbg);
        border-color: var(--ac);
        color: var(--ac);
      }
      .cfg {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="text"] {
        flex: 1;
        min-width: 160px;
        font: 12px var(--mono);
        background: var(--s1);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 5px 8px;
      }
      input[type="file"] {
        font: 11px var(--mono);
        color: var(--mu);
        max-width: 200px;
      }
      .btn {
        font: 12px var(--sans);
        background: var(--tx);
        color: var(--bg);
        border: 0;
        border-radius: var(--r);
        padding: 5px 12px;
        cursor: pointer;
      }
      .btn.ghost {
        background: var(--s1);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      #status {
        font: 11px var(--mono);
        color: var(--mu);
        margin-top: 6px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 18px 16px 46vh;
      }
      #reader {
        font: 20px/2.3 var(--jp);
        letter-spacing: 0.02em;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #reader p {
        margin: 0 0 0.6em;
      }
      .t {
        border-radius: 2px;
        cursor: pointer;
        border-bottom: 1px solid transparent;
      }
      .t:hover {
        background: var(--s2);
      }
      .t.sel {
        background: var(--acbg);
        border-bottom-color: var(--ac);
        color: var(--ac);
      }
      .pc {
        color: var(--mu);
      }
      details {
        margin-top: 28px;
        border-top: 1px solid var(--bd);
        padding-top: 10px;
      }
      summary {
        font: 11px var(--mono);
        color: var(--mu);
        cursor: pointer;
      }
      textarea {
        width: 100%;
        height: 120px;
        margin-top: 8px;
        font: 14px var(--jp);
        background: var(--s1);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 8px;
      }
      #sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        background: var(--bg);
        border-top: 1px solid var(--bd);
        max-height: 44vh;
        overflow: auto;
        padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      }
      #sheet > div {
        max-width: 720px;
        margin: 0 auto;
      }
      .lab {
        font: 10px var(--mono);
        color: var(--mu);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 10px 0 4px;
        display: flex;
        justify-content: space-between;
      }
      .sel-word {
        font: 600 24px var(--jp);
        letter-spacing: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .tag {
        font: 11px var(--mono);
        border: 1px solid var(--bd);
        background: var(--s1);
        border-radius: var(--r);
        padding: 0 6px;
        color: var(--mu);
      }
      .out {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 8px 10px;
        white-space: pre-wrap;
      }
      .out.gen {
        border-color: var(--ac);
      }
      .muted {
        color: var(--mu);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>yomu <span id="gpu">webgpu: …</span></h1>
      <div class="pills" id="pills"></div>
      <div class="cfg">
        <input
          type="text"
          id="model"
          spellcheck="false"
          aria-label="model id"
        />
        <input type="file" id="file" hidden accept=".task,.bin,.litertlm" />
        <button class="btn ghost" id="fbtn" hidden>choose .task</button>
        <button class="btn" id="load">load</button>
      </div>
      <div id="status">engine: none</div>
    </header>
    <main>
      <div id="reader"></div>
      <details>
        <summary>EDIT STORY TEXT</summary>
        <textarea id="src"></textarea>
        <button class="btn ghost" id="apply" style="margin-top: 6px">
          render
        </button>
      </details>
    </main>
    <section id="sheet">
      <div>
        <div class="muted" id="hint">
          Tap a word, or press and slide across several words.
        </div>
        <div id="detail" hidden>
          <div class="row">
            <span class="sel-word" id="sw"></span
            ><span class="tag" id="stag"></span
            ><span class="tag" id="lat"></span>
          </div>
          <div class="lab"><span>dictionary</span><span id="eng1"></span></div>
          <div class="out" id="dict"></div>
          <div class="lab"><span>context translation</span></div>
          <div class="muted" id="sent" style="font: 13px var(--jp)"></div>
          <div class="out gen" id="ctx" style="margin-top: 4px"></div>
        </div>
      </div>
    </section>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const SAMPLE =
        "昔々、ある小さな村に、一人の少女が住んでいました。\n少女は毎朝、森の中の古い井戸へ水を汲みに行きました。\nある日、井戸の底から小さな声が聞こえました。「助けてください。」\n少女は驚いて、井戸の中をのぞきました。";
      $("src").value = SAMPLE;
      $("gpu").textContent =
        "webgpu: " + (navigator.gpu ? "available" : "unavailable");
      const status = (t) => ($("status").textContent = t);

      /* ---------- tokenizer (built-in Intl.Segmenter) ---------- */
      const seg = new Intl.Segmenter("ja", { granularity: "word" });
      let toks = [],
        sents = [];
      function render(text) {
        toks = [];
        sents = [];
        const r = $("reader");
        r.innerHTML = "";
        text
          .split("\n")
          .filter((l) => l.trim())
          .forEach((line) => {
            const p = document.createElement("p");
            let sid = sents.length;
            sents.push("");
            for (const s of seg.segment(line)) {
              const i = toks.length;
              toks.push({ w: s.segment, sid, word: !!s.isWordLike });
              sents[sid] += s.segment;
              const el = document.createElement("span");
              el.textContent = s.segment;
              el.className = s.isWordLike ? "t" : "pc";
              el.dataset.i = i;
              p.appendChild(el);
              if (/[。！？!?]$/.test(s.segment)) {
                sid = sents.length;
                sents.push("");
              }
            }
            r.appendChild(p);
          });
        sents = sents.map((s) => s.trim());
      }
      $("apply").onclick = () => render($("src").value);

      /* ---------- tap + slide selection ---------- */
      let anchor = null,
        drag = false,
        cur = [0, 0];
      const tokEl = (n) => n?.closest?.(".t");
      function paint(a, b) {
        const [lo, hi] = [Math.min(a, b), Math.max(a, b)];
        cur = [lo, hi];
        $("reader")
          .querySelectorAll("[data-i]")
          .forEach((el) => {
            const i = +el.dataset.i;
            el.classList.toggle("sel", i >= lo && i <= hi);
          });
      }
      const R = $("reader");
      R.addEventListener("pointerdown", (e) => {
        const t = tokEl(e.target);
        if (!t) return;
        drag = true;
        anchor = +t.dataset.i;
        paint(anchor, anchor);
      });
      R.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const t = tokEl(document.elementFromPoint(e.clientX, e.clientY));
        if (t) paint(anchor, +t.dataset.i);
      });
      addEventListener("pointerup", () => {
        if (!drag) return;
        drag = false;
        commit();
      });
      R.addEventListener("pointercancel", () => {
        drag = false;
      });

      /* ---------- engines ---------- */
      const WLLM = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";
      const TJS =
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0";
      const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.22";
      const dev = () => (navigator.gpu ? "webgpu" : "wasm");
      const wordPrompt = (w, s) =>
        `Word: ${w}\nSentence: ${s}\nAnswer in exactly 3 lines:\nReading: <hiragana>\nPOS: <part of speech>\nMeaning: <English meanings, the sense used in this sentence first>`;
      const ctxPrompt = (s) =>
        `Translate this Japanese sentence into natural English. Output only the translation.\n${s}`;

      const ENGINES = {
        none: {
          label: "none",
          def: "",
          async load() {},
          async lookup(w) {
            return { dict: "(no engine loaded — segmentation only)", ctx: "—" };
          },
        },
        webllm: {
          label: "MiniLLM · WebLLM",
          def: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC",
          eng: null,
          async load(id) {
            const m = await import(WLLM);
            this.eng = await m.CreateMLCEngine(id, {
              initProgressCallback: (r) => status(r.text),
            });
          },
          async ask(p) {
            const r = await this.eng.chat.completions.create({
              messages: [{ role: "user", content: p }],
              temperature: 0.1,
              max_tokens: 180,
            });
            return r.choices[0].message.content.trim();
          },
          async lookup(w, s) {
            return {
              dict: await this.ask(wordPrompt(w, s)),
              ctx: await this.ask(ctxPrompt(s)),
            };
          },
        },
        mediapipe: {
          label: "MediaPipe LLM",
          def: "(pick a Gemma .task file, or paste a URL)",
          llm: null,
          file: true,
          async load(url, file) {
            const m = await import(MP + "/+esm");
            const fs = await m.FilesetResolver.forGenAiTasks(MP + "/wasm");
            const path = file ? URL.createObjectURL(file) : url;
            this.llm = await m.LlmInference.createFromOptions(fs, {
              baseOptions: { modelAssetPath: path },
              maxTokens: 1024,
              topK: 1,
              temperature: 0.1,
              randomSeed: 1,
            });
          },
          async ask(p) {
            return (
              await this.llm.generateResponse(
                `<start_of_turn>user\n${p}<end_of_turn>\n<start_of_turn>model\n`,
              )
            ).trim();
          },
          async lookup(w, s) {
            return {
              dict: await this.ask(wordPrompt(w, s)),
              ctx: await this.ask(ctxPrompt(s)),
            };
          },
        },
        opus: {
          label: "Seq2seq · opus-mt",
          def: "Xenova/opus-mt-ja-en",
          pipe: null,
          async load(id) {
            const m = await import(TJS);
            this.pipe = await m.pipeline("translation", id, {
              device: dev(),
              progress_callback: (p) =>
                p.status &&
                status(
                  `${p.status} ${p.file || ""} ${p.progress ? Math.round(p.progress) + "%" : ""}`,
                ),
            });
          },
          async tr(t) {
            return (await this.pipe(t, { max_new_tokens: 120 }))[0]
              .translation_text;
          },
          async lookup(w, s) {
            return {
              dict:
                "gloss: " +
                (await this.tr(w)) +
                "\n(translation model — no reading/POS)",
              ctx: await this.tr(s),
            };
          },
        },
        deberta: {
          label: "DeBERTa · UPOS",
          def: "KoichiYasuoka/deberta-small-japanese-upos",
          pipe: null,
          async load(id) {
            const m = await import(TJS);
            this.pipe = await m.pipeline("token-classification", id, {
              device: dev(),
              progress_callback: (p) =>
                p.status &&
                status(
                  `${p.status} ${p.file || ""} ${p.progress ? Math.round(p.progress) + "%" : ""}`,
                ),
            });
          },
          async lookup(w, s) {
            const o = await this.pipe(s);
            const hit = o.filter((e) => {
              const x = (e.word || "").replace(/^▁/, "");
              return x && (w.includes(x) || x.includes(w));
            });
            return {
              dict: hit.length
                ? hit
                    .map((e) => `${e.word}  ${e.entity}  ${e.score.toFixed(2)}`)
                    .join("\n")
                : "(no tag matched)",
              ctx:
                "(encoder-only model: tags words, cannot translate)\n" +
                o.map((e) => `${e.word}/${e.entity}`).join(" "),
            };
          },
        },
      };
      const cache = new Map();
      let req = 0;
      let key = "none",
        ready = { none: true };
      const pills = $("pills");
      Object.entries(ENGINES).forEach(([k, e]) => {
        const b = document.createElement("button");
        b.className = "pill";
        b.textContent = e.label;
        b.onclick = () => pick(k);
        b.dataset.k = k;
        pills.appendChild(b);
      });
      function pick(k) {
        key = k;
        const e = ENGINES[k];
        pills
          .querySelectorAll(".pill")
          .forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === k));
        $("model").value = e.def;
        $("model").hidden = k === "none";
        $("load").hidden = k === "none";
        $("fbtn").hidden = !e.file;
        $("model").placeholder = "model id";
        status(`engine: ${k} · ${ready[k] ? "ready" : "not loaded"}`);
        cache.clear();
      }
      $("fbtn").onclick = () => $("file").click();
      $("file").onchange = () =>
        status("file: " + ($("file").files[0]?.name || ""));
      $("load").onclick = async () => {
        const e = ENGINES[key];
        $("load").disabled = true;
        const t0 = performance.now();
        try {
          status("loading…");
          await e.load($("model").value.trim(), $("file").files[0]);
          ready[key] = true;
          status(
            `engine: ${key} · ready · load ${((performance.now() - t0) / 1000).toFixed(1)}s`,
          );
        } catch (err) {
          status("error: " + (err.message || err));
        }
        $("load").disabled = false;
      };
      pick("none");

      /* ---------- lookup ---------- */
      async function commit() {
        const [lo, hi] = cur;
        const word = toks
          .slice(lo, hi + 1)
          .map((t) => t.w)
          .join("");
        const sent = sents[toks[lo].sid];
        $("hint").hidden = true;
        $("detail").hidden = false;
        $("sw").textContent = word;
        $("stag").textContent = lo === hi ? "word" : `${hi - lo + 1} tokens`;
        $("sent").textContent = sent;
        $("eng1").textContent = key;
        const k = key + "|" + word + "|" + sent,
          id = ++req;
        if (cache.has(k)) {
          show(cache.get(k));
          return;
        }
        if (!ready[key]) {
          $("dict").textContent = "Load the engine first.";
          $("ctx").textContent = "";
          $("lat").textContent = "";
          return;
        }
        $("dict").textContent = "…";
        $("ctx").textContent = "…";
        $("lat").textContent = "";
        const t0 = performance.now();
        try {
          const r = await ENGINES[key].lookup(word, sent);
          r.ms = Math.round(performance.now() - t0);
          cache.set(k, r);
          if (id === req) show(r);
        } catch (err) {
          if (id === req) {
            $("dict").textContent = "error: " + (err.message || err);
            $("ctx").textContent = "";
          }
        }
      }
      function show(r) {
        $("dict").textContent = r.dict;
        $("ctx").textContent = r.ctx;
        $("lat").textContent = r.ms + " ms";
      }

      render(SAMPLE);
    </script>
  </body>
</html>
